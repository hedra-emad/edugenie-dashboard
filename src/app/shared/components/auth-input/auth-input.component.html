<div class="relative w-full mb-4">
      <label *ngIf="label" [for]="id" class="block text-sm  font-medium text-text-primary mb-1 mt-2">
        {{ label }}
      </label>
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <ng-content select="[icon]"></ng-content>
        </div>
        <input
          [id]="id"
          [type]="type"
          [formControl]="formControl"
          [placeholder]="placeholder"
          class="w-full bg-surface border border-gray-200 text-text-primary rounded-xl py-2 mb-1 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 placeholder:text-gray-400"
          [ngClass]="{
            'border-error focus:ring-error': control?.invalid && control?.touched,
            'pr-10': showSuccessWhenValid && control?.valid && control?.touched
          }"
        />
       @if (control?.invalid && control?.touched) {
  <div class="absolute left-0 top-full mt-1 text-xs text-error">

    @for (errorKey of Object.keys(control?.errors || {}); track errorKey; let first = $first) {
      @if (first) {
        <span>
          {{ getErrorMessage(errorKey) }}
        </span>
      }
    }

  </div>
}
