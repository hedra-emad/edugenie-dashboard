<div class="mb-5 relative">
      <label *ngIf="label" [for]="id" class="block text-sm font-medium text-text-primary mb-2">
        {{ label }}
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <ng-content select="[icon]"></ng-content>
        </div>
        <input
          [id]="id"
          [type]="type"
          [formControl]="formControl"
          [placeholder]="placeholder"
          class="w-full bg-surface border border-gray-200 text-text-primary rounded-xl py-3 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 placeholder:text-gray-400"
          [ngClass]="{'border-error focus:ring-error': control?.invalid && control?.touched}"
        />
      </div>
      @if (control?.invalid && control?.touched) {
        <div class="text-error text-xs mt-1.5 ml-1 absolute">
          @if (control?.errors?.['required']) {
            <span>{{ label }} is required.</span>
          }
          @if (control?.errors?.['email']) {
            <span>Invalid email address.</span>
          }
        </div>
      }
    </div>
