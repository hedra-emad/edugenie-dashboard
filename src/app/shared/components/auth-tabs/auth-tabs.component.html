<div class="flex p-1 bg-[#F4F7F9] rounded-xl mb-6 shadow-inner">
      <button
        type="button"
        (click)="selectTab('signin')"
        class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200"
        [ngClass]="activeTab === 'signin' ? 'bg-white text-primary shadow-sm' : 'text-gray-500 hover:text-gray-700'"
      >
        Sign In
      </button>
      <button
        type="button"
        (click)="selectTab('signup')"
        class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200"
        [ngClass]="activeTab === 'signup' ? 'bg-white text-primary shadow-sm' : 'text-gray-500 hover:text-gray-700'"
      >
        Create Account
      </button>
    </div>
