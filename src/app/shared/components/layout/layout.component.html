<div class="flex h-screen bg-[var(--color-background-page)]">

  <!-- Sidebar (mobile overlay) -->
  <!-- Overlay -->
  <div *ngIf="isMobile && sidebarOpen" class="fixed inset-0 bg-black/40 z-40" (click)="sidebarOpen = false"></div>



  <app-sidebar class="fixed lg:static z-50 w-64 h-full bg-white
       transition-transform duration-300" [class.-translate-x-full]="isMobile && !sidebarOpen" [isMobile]="isMobile"
    [sidebarOpen]="sidebarOpen" (close)="sidebarOpen = false"></app-sidebar>

  <!-- Main -->
  <div class="flex flex-col flex-1">

    <app-navbar [sidebarOpen]="sidebarOpen" (menuClick)="toggleSidebar()"></app-navbar>

    <main class="flex-1 overflow-auto p-4">
      <router-outlet></router-outlet>

    </main>

  </div>

</div>
