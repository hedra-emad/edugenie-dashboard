<div class="sidebar-profile flex flex-col items-center text-center py-4 transition-all duration-300">

  <!-- Avatar -->
  <img
    class="rounded-full object-cover transition-all duration-300"
    [ngClass]="{
      'sidebar-profile__avatar--small': isMobile && !sidebarExpanded,
      'sidebar-profile__avatar--large': !isMobile || sidebarExpanded
    }"
    [src]="user?.avatar || '/public/avatar.png'"
        alt="User avatar"
  />

  <!-- Name (hidden when mobile collapsed) -->
  <h3 *ngIf="showDetails"
      class="sidebar-profile__name mt-2 text-sm font-semibold truncate transition-all duration-300"
      [ngClass]="{
        'text-white': isMobile,
        'sidebar-profile__name--desktop': !isMobile
      }">
{{ user?.firstName }} {{ user?.lastName }}
  </h3>

  <!-- Role (hidden when mobile collapsed) -->
  <p *ngIf="showDetails"
     class="sidebar-profile__role text-xs truncate transition-all duration-300"
     [ngClass]="{
       'text-white/70': isMobile,
       'sidebar-profile__role--desktop': !isMobile
     }">
   {{ user?.role }}
  </p>

</div>
