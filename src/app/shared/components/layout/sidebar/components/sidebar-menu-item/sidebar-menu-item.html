<button
  class="menu-item flex items-center w-full text-sm cursor-pointer
         transition-all duration-300 border-0 bg-transparent
         focus:outline-none"
  [ngClass]="{
    'menu-item--mobile': isMobile,
    'menu-item--desktop': !isMobile,
    'menu-item--active-mobile': active && isMobile,
    'menu-item--active-desktop': active && !isMobile,
    'menu-item--collapsed': isMobile && !sidebarExpanded,
    'menu-item--expanded': !isMobile || sidebarExpanded
  }">

  <mat-icon class="menu-item__icon shrink-0">{{ icon }}</mat-icon>

  <span *ngIf="showLabel"
        class="menu-item__label whitespace-nowrap overflow-hidden transition-all duration-300">
    {{ label }}
  </span>

</button>
