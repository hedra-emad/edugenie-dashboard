<div class="flex justify-center px-3 py-2">

  <button
    class="sidebar-action__btn flex items-center justify-center gap-2
           font-medium text-sm cursor-pointer
           transition-all duration-300
           focus:outline-none focus:ring-2"
    [ngClass]="{
      'sidebar-action__btn--circle': isMobile && !sidebarExpanded,
      'sidebar-action__btn--full': !isMobile || sidebarExpanded,
      'sidebar-action__btn--mobile': isMobile,
      'sidebar-action__btn--desktop': !isMobile
    }">

    <mat-icon class="text-[20px]">add</mat-icon>

    <span *ngIf="showLabel" class="whitespace-nowrap">
      Create New Course
    </span>

  </button>

</div>
