<aside
  class="sidebar h-full flex flex-col overflow-hidden transition-all duration-300 shrink-0"
  [class.sidebar--desktop]="!isMobile"
  [class.sidebar--mobile]="isMobile"
  [class.sidebar--expanded]="isMobile && sidebarExpanded"
  [class.sidebar--collapsed]="isMobile && !sidebarExpanded">

  <!-- Toggle button (mobile only) -->
  <div *ngIf="isMobile"
       class="flex justify-center py-3 shrink-0">
    <button
      (click)="toggle.emit()"
      class="sidebar__toggle w-10 h-10 flex items-center justify-center rounded-full
             cursor-pointer transition-all duration-300
             hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/40"
      [style.color]="'var(--color-surface)'"
      aria-label="Toggle sidebar">
      <mat-icon>
  {{ sidebarExpanded ? 'chevron_left' : 'chevron_right' }}
</mat-icon>
    </button>
  </div>

  <!-- Profile section -->
  <app-sidebar-profile
    [isMobile]="isMobile"
    [sidebarExpanded]="sidebarExpanded">
  </app-sidebar-profile>



  <!-- Navigation menu -->
  <app-sidebar-menu
    class="flex-1 overflow-y-auto overflow-x-hidden"
    [isMobile]="isMobile"
    [sidebarExpanded]="sidebarExpanded">
  </app-sidebar-menu>

  <!-- Auth buttons — pinned to very bottom of sidebar -->
  <div class="mt-auto shrink-0 py-4 border-t border-[var(--color-border)]" [ngClass]="sidebarExpanded ? 'px-3' : 'px-1'">
    <app-navbar-auth [isMobile]="isMobile" [sidebarExpanded]="sidebarExpanded"></app-navbar-auth>
  </div>

</aside>
