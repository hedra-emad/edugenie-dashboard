<div>
      <label class="block text-sm font-medium text-text-primary mb-1">
        Select your role
      </label>
      <div class="grid grid-cols-2 gap-4">
        <button
          type="button"
          (click)="selectRole('student')"
          class="flex flex-col items-center justify-center p-4 border rounded-[var(--radius-md)] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
          [ngClass]="value === 'student' ? 'border-primary ring-1 ring-primary' : 'border-gray-200 hover:border-gray-300 bg-white'"
        >
          <svg class="w-6 h-6 mb-2" [ngClass]="value === 'student' ? 'text-primary' : 'text-primary'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14v6m0 0l-3-3m3 3l3-3"></path>
          </svg>
          <span class="text-sm font-semibold" [ngClass]="value === 'student' ? 'text-text-primary' : 'text-text-secondary'">Student</span>
        </button>
        <button
          type="button"
          (click)="selectRole('instructor')"
          class="flex flex-col items-center justify-center p-4 border rounded-[var(--radius-md)] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
          [ngClass]="value === 'instructor' ? 'border-secondary bg-blue-50/30 ring-1 ring-secondary' : 'border-gray-200 hover:border-gray-300 bg-white'"
        >
          <svg class="w-6 h-6 mb-2" [ngClass]="value === 'instructor' ? 'text-primary' : 'text-primary'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
          </svg>
          <span class="text-sm font-semibold" [ngClass]="value === 'instructor' ? 'text-text-primary' : 'text-text-secondary'">Instructor</span>
        </button>
      </div>
    </div>
