<div class="text-center py-16 border-2 border-dashed border-[var(--color-border)] rounded-2xl bg-[var(--color-surface)] shadow-sm">
  <mat-icon class="text-[var(--color-text-secondary)] opacity-50 text-[48px] w-12 h-12 mx-auto mb-2">
    {{ icon }}
  </mat-icon>
  
  <p class="text-sm font-bold text-[var(--color-text-primary)]">
    {{ title }}
  </p>
  
  <p class="text-xs text-[var(--color-text-secondary)] mt-1 max-w-[280px] mx-auto">
    {{ description }}
  </p>
  
  @if (showAction) {
    <button 
      type="button" 
      (click)="onActionClick()"
      class="mt-4 text-xs font-extrabold text-[var(--color-primary)] uppercase tracking-wider px-4 py-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] hover:bg-[var(--color-background)] transition-colors">
      {{ actionLabel }}
    </button>
  }
</div>
