<!-- Desktop: 3 cards in one container with dividers -->
<div

    <!-- Total Earnings -->
    <div class="p-7 flex flex-col gap-6 border-r border-slate-100">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-[#EDE9FF] flex items-center justify-center shrink-0 shadow-inner">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#7C3AED" stroke-width="1.8" />
                    <path
                        d="M12 6v1.5M12 16.5V18M9.5 9.5C9.5 8.4 10.6 7.5 12 7.5s2.5.9 2.5 2-.9 1.8-2.5 2c-1.6.2-2.5 1-2.5 2.1 0 1.1 1.1 2 2.5 2s2.5-.9 2.5-2"
                        stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" />
                </svg>
            </div>
            <span
                class="text-[10px] font-black uppercase tracking-[var(--tracking-wide)] text-[var(--color-text-secondary)]">Total
                Earnings</span>
        </div>
        <div class="flex flex-col">
            <p class="text-3xl font-black text-[var(--color-text-primary)] tracking-tighter leading-none">$12,450.00</p>
            <div class="flex items-center gap-1.5 mt-2">

                    <path d="M3 17l5-5 4 4 9-10" stroke="#22C55E" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span class="text-[11px] font-bold text-[var(--color-success)] uppercase tracking-wide">+14% from last
                    month</span>
            </div>
        </div>
    </div>

    <div class="p-7 flex flex-col gap-6 border-r border-slate-100">

                    <circle cx="17" cy="15" r="1.5" fill="#00B0FF" />

            </div>
            <span

        </div>
        <div class="flex flex-col">
            <p class="text-3xl font-black text-[var(--color-text-primary)] tracking-tighter leading-none">$1,200.00</p>
            <span
                class="text-[11px] text-[var(--color-text-secondary)] font-bold uppercase tracking-wider mt-2 opacity-70">Available

        </div>
    </div>

    <div class="p-7 flex flex-col gap-6">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-[#EDE9FF] flex items-center justify-center shrink-0 shadow-inner">

                    <path d="M21 20c0-2.8-1.8-5.1-4-5.8" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" />

            </div>
            <span
                class="text-[10px] font-black uppercase tracking-[var(--tracking-wide)] text-[var(--color-text-secondary)]">Total

        </div>
        <div class="flex flex-col">
            <p class="text-3xl font-black text-[var(--color-text-primary)] tracking-tighter leading-none">1,420</p>

                </svg>
                <span class="text-[11px] font-bold text-[var(--color-success)] uppercase tracking-wide">+52 new this
                    week</span>
            </div>
        </div>
    </div>
</div>
