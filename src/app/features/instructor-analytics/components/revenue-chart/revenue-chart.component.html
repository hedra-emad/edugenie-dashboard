<div class="w-full overflow-visible py-4">
    <svg viewBox="0 0 900 290" preserveAspectRatio="xMidYMid meet" class="w-full h-auto overflow-visible"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#00B0FF" stop-opacity="0.18" />
                <stop offset="100%" stop-color="#00B0FF" stop-opacity="0" />
            </linearGradient>

            <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Grid Lines -->
        <g class="grid-lines">
            <text x="44" y="24" text-anchor="end" font-size="11" font-weight="600" font-family="Inter,sans-serif"
                fill="#94A3B8">$500</text>
            <line x1="52" y1="20" x2="892" y2="20" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="6 4" />

            <text x="44" y="134" text-anchor="end" font-size="11" font-weight="600" font-family="Inter,sans-serif"
                fill="#94A3B8">$250</text>
            <line x1="52" y1="130" x2="892" y2="130" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="6 4" />

            <text x="44" y="234" text-anchor="end" font-size="11" font-weight="600" font-family="Inter,sans-serif"
                fill="#94A3B8">$0</text>
            <line x1="52" y1="230" x2="892" y2="230" stroke="#F1F5F9" stroke-width="1.5" />
        </g>

        <!-- Area Fill -->
        <path d="M 60 221
         C 144 221, 144 186, 228 186
         C 312 186, 312 164, 396 164
         C 480 164, 480 120, 564 120
         C 648 120, 648 142, 732 142
         C 808 142, 808 27, 880 27
         L 880 230 L 60 230 Z" fill="url(#areaGradient)" />

        <!-- Line -->
        <path d="M 60 221
         C 144 221, 144 186, 228 186
         C 312 186, 312 164, 396 164
         C 480 164, 480 120, 564 120
         C 648 120, 648 142, 732 142
         C 808 142, 808 27, 880 27" fill="none" stroke="#00B0FF" stroke-width="3.5" stroke-linecap="round"
            stroke-linejoin="round" filter="url(#lineGlow)" />

        <!-- Data Points -->
        <g stroke-width="2.5" fill="white" stroke="#00B0FF">
            <circle cx="60" cy="221" r="4.5" />
            <circle cx="228" cy="186" r="4.5" />
            <circle cx="396" cy="164" r="4.5" />
            <circle cx="564" cy="120" r="4.5" />
            <circle cx="732" cy="142" r="4.5" />

            <!-- Animated last point -->
            <circle cx="880" cy="27" r="6" fill="#00B0FF" stroke-width="0">
                <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
            </circle>
            <circle cx="880" cy="27" r="5" fill="white" stroke="#00B0FF" stroke-width="3" />
        </g>

        <!-- X-axis Labels -->
        <g font-size="11" font-weight="700" font-family="Inter,sans-serif" fill="#94A3B8" text-anchor="middle"
            style="text-transform: uppercase; letter-spacing: 0.05em;">
            <text x="60" y="268">Sep 15</text>
            <text x="228" y="268">Sep 22</text>
            <text x="396" y="268">Sep 29</text>
            <text x="564" y="268">Oct 06</text>
            <text x="732" y="268">Oct 13</text>
            <text x="880" y="268" fill="#00B0FF" font-weight="900">Today</text>
        </g>
    </svg>
</div>
