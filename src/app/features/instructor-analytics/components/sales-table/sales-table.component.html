<section class="bg-white rounded-2xl border border-slate-100 shadow-[var(--shadow-card)] overflow-hidden mt-6">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-50">
        <h2 class="text-[14px] font-black text-[var(--color-text-primary)]">Recent Sales</h2>
        <button *ngIf="recentSales && recentSales.length > 5" mat-button
            class="!text-[var(--color-text-secondary)] !font-bold !text-[11px] !tracking-[0.1em] uppercase !px-3 !py-1.5 !min-w-0 !rounded-lg border border-transparent hover:!border-slate-200 hover:!bg-slate-50 hover:!text-[var(--color-secondary)] transition-all duration-200">
            View All
        </button>
    </div>

    <div class="overflow-x-auto w-full">
        <table class="w-full min-w-[450px] sm:min-w-[600px]">
            <thead>
                <tr class="border-b border-slate-50 bg-slate-50/50">
                    <th
                        class="px-4 sm:px-6 py-3 text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        Student</th>
                    <th
                        class="hidden sm:table-cell px-4 sm:px-6 py-3 text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        Course</th>
                    <th
                        class="px-4 sm:px-6 py-3 text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        Date</th>
                    <th
                        class="px-4 sm:px-6 py-3 text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        Amount</th>
                    <th
                        class="px-4 sm:px-6 py-3 text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <tr *ngFor="let sale of recentSales" class="hover:bg-slate-50/50 transition-colors">
                    <td class="px-4 sm:px-6 py-4">
                        <span class="text-[11px] sm:text-[13px] font-medium text-[var(--color-text-primary)]">{{
                            sale.studentName }}</span>
                    </td>
                    <td class="hidden sm:table-cell px-4 sm:px-6 py-4">
                        <span class="text-[11px] sm:text-[13px] text-slate-500">{{ sale.courseTitle }}</span>
                    </td>
                    <td class="px-4 sm:px-6 py-4">
                        <span class="text-[11px] sm:text-[13px] text-slate-500">{{ sale.date | date:'mediumDate'
                            }}</span>
                    </td>
                    <td class="px-4 sm:px-6 py-4">
                        <span class="text-[11px] sm:text-[13px] font-bold text-[var(--color-secondary)]">${{ sale.price
                            | number:'1.2-2' }}</span>
                    </td>
                    <td class="px-4 sm:px-6 py-4">
                        <mat-chip-set>
                            <mat-chip *ngIf="sale.status === 'COMPLETED'"
                                class="!bg-green-100 !text-green-800 !font-bold !text-[8px] sm:!text-[10px] !min-h-0 !h-5 sm:!h-6">COMPLETED</mat-chip>
                            <mat-chip *ngIf="sale.status === 'REFUNDED'"
                                class="!bg-red-100 !text-red-800 !font-bold !text-[8px] sm:!text-[10px] !min-h-0 !h-5 sm:!h-6">REFUNDED</mat-chip>
                        </mat-chip-set>
                    </td>
                </tr>
                <tr *ngIf="!recentSales || recentSales.length === 0">
                    <td colspan="5" class="px-4 sm:px-6 py-8 text-center text-sm text-slate-400">
                        No recent sales found.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
