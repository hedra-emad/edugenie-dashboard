<div class="min-h-screen flex items-center justify-center px-4 bg-gray-50">
  <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
    <ng-container *ngIf="!sent(); else sentTpl">
      <h1 class="text-xl font-bold text-gray-900">Forgot your password?</h1>
      <p class="mt-1.5 text-sm text-gray-500">
        Enter your email and we'll send you a link to reset it.
      </p>
      <form (ngSubmit)="submit()" class="mt-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input
            type="email"
            name="email"
            required
            [(ngModel)]="email"
            placeholder="you@example.com"
            class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-800 outline-none transition-colors placeholder:text-gray-400 focus:border-[#2e2a91] focus:ring-1 focus:ring-[#2e2a91]"
          />
        </div>
        <p *ngIf="error()" class="text-sm text-rose-600">{{ error() }}</p>
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full rounded-xl bg-[#2e2a91] text-white text-sm font-bold px-4 py-3 hover:bg-[#241f75] transition-colors disabled:opacity-60"
        >
          {{ loading() ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>
      <p class="mt-4 text-center text-sm text-gray-500">
        Remembered it?
        <a routerLink="/admin-login" class="font-semibold text-[#2e2a91] hover:underline">Sign in</a>
      </p>
    </ng-container>

    <ng-template #sentTpl>
      <div class="text-center">
        <h1 class="text-xl font-bold text-gray-900">Check your email</h1>
        <p class="mt-2 text-sm text-gray-500">
          If an account exists for <strong>{{ email }}</strong>, we've sent a
          link to reset your password. The link expires in 60 minutes.
        </p>
        <a
          routerLink="/admin-login"
          class="mt-6 inline-block text-sm font-semibold text-[#2e2a91] hover:underline"
          >Back to sign in</a
        >
      </div>
    </ng-template>
  </div>
</div>
