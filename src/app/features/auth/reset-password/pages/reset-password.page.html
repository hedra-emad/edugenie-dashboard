<div class="min-h-screen flex items-center justify-center px-4 bg-gray-50">
  <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
    <ng-container *ngIf="!done(); else doneTpl">
      <h1 class="text-xl font-bold text-gray-900">Choose a new password</h1>
      <p class="mt-1.5 text-sm text-gray-500">Enter a new password for your account.</p>
      <form (ngSubmit)="submit()" class="mt-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">New password</label>
          <input
            type="password"
            name="password"
            required
            [(ngModel)]="password"
            placeholder="At least 6 characters"
            class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-800 outline-none transition-colors placeholder:text-gray-400 focus:border-[#2e2a91] focus:ring-1 focus:ring-[#2e2a91]"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm password</label>
          <input
            type="password"
            name="confirm"
            required
            [(ngModel)]="confirm"
            placeholder="Re-enter your password"
            class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-800 outline-none transition-colors placeholder:text-gray-400 focus:border-[#2e2a91] focus:ring-1 focus:ring-[#2e2a91]"
          />
        </div>
        <p *ngIf="error()" class="text-sm text-rose-600">{{ error() }}</p>
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full rounded-xl bg-[#2e2a91] text-white text-sm font-bold px-4 py-3 hover:bg-[#241f75] transition-colors disabled:opacity-60"
        >
          {{ loading() ? 'Resetting…' : 'Reset password' }}
        </button>
      </form>
    </ng-container>

    <ng-template #doneTpl>
      <div class="text-center">
        <h1 class="text-xl font-bold text-gray-900">Password reset</h1>
        <p class="mt-2 text-sm text-gray-500">
          Your password has been updated. You can now sign in with your new
          password.
        </p>
        <a
          routerLink="/admin-login"
          class="mt-6 inline-block rounded-xl bg-[#2e2a91] text-white text-sm font-bold px-6 py-3 hover:bg-[#241f75] transition-colors"
          >Go to sign in</a
        >
      </div>
    </ng-template>
  </div>
</div>
