<app-auth-layout>
  <app-auth-logo></app-auth-logo>

  <app-auth-card>

    <div class="auth-card-header">
      <!-- Tabs -->
      <app-auth-tabs
        *ngIf="!isWatchMode()"
        [activeTab]="'signup'"
        (onTabChange)="handleTabChange($event)">
      </app-auth-tabs>

      <!-- Progress Bar -->
      <div class="mb-4 max-[360px]:mb-3" *ngIf="!isWatchMode()">
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-xs font-semibold text-text-secondary uppercase tracking-wider max-[360px]:text-2xs">
            Step {{ currentStep }} of {{ totalSteps }}
          </span>
          <span class="text-xs font-semibold text-primary max-[360px]:text-2xs">
            {{ getStepTitle() }}
          </span>
        </div>
        <div class="h-1.5 w-full bg-gray-200 rounded-full overflow-hidden">
          <div
            class="h-full bg-primary transition-all duration-400 ease-in-out rounded-full"
            [style.width]="progressPercent + '%'">
          </div>
        </div>
      </div>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="nextStep()" class="auth-card-form">

      <div class="auth-step-region">

        <!-- Role Selection -->
        <ng-container *ngIf="currentStep === 1" formGroupName="roleSelection">
          <div class="animate-fade-in">
            <app-role-selector formControlName="role"></app-role-selector>
          </div>
        </ng-container>

        <!-- Account Information -->
        <ng-container *ngIf="currentStep === 2" formGroupName="accountInfo">
          <div class="animate-fade-in space-y-3 max-[360px]:space-y-2.5">

            <!-- First Name + Last Name  -->
           <div class="grid grid-cols-1">
              <app-auth-input
                id="firstName"
                label="First Name"
                placeholder="John"
                [showSuccessWhenValid]="true"
                [control]="accountInfo.get('firstName')"
                [errorMessages]="{
                  required: 'Please Enter your first name',
                  minlength: 'First Name must be at least 2 characters',
                  pattern: 'First Name must contain only letters'
                }"
                >
                <svg icon class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </app-auth-input>

              <app-auth-input
                *ngIf="!isWatchMode()"
                id="lastName"
                label="Last Name"
                placeholder="Doe"
                [showSuccessWhenValid]="true"
                [control]="accountInfo.get('lastName')"
                [errorMessages]="{
    required: 'Please Enter your las name',
    minlength: 'Last name must be at least 2 characters',
    pattern: 'Last name can only contain letters'
  }">
                <svg icon class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </app-auth-input>
            </div>

            <!-- Email -->
            <app-auth-input
              id="email"
              type="email"
              label="Email Address"
              placeholder="john@example.com"
              [showSuccessWhenValid]="true"
              [control]="accountInfo.get('email')">
              <svg icon class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </app-auth-input>

          </div>
        </ng-container>

        <!-- Security Information -->
        <ng-container *ngIf="currentStep === 3" formGroupName="securityInfo">
          <div class="animate-fade-in space-y-3 max-[360px]:space-y-2.5">
            <!-- Password -->
            <app-password-input
              id="password"
              label="Password"
              placeholder="Create a strong password"
              [control]="securityInfo.get('password')">
            </app-password-input>

            <!-- Password Strength Meter -->
            <div
             *ngIf="!isWatchMode() &&
      (securityInfo.get('password')?.touched ||
       securityInfo.get('password')?.value)">
              <div class="flex justify-between items-center">
                <span class="text-xs text-text-secondary">Password strength</span>
                <span
  class="text-xs font-medium"
  [ngClass]="getStrengthTextColor()">
  {{ getPasswordStrengthText() }}
</span>
              </div>
              <div class="flex gap-1 h-1.5 mt-1 mb-5">
                <div class="flex-1 rounded-full transition-colors duration-300" [ngClass]="getStrengthColor(0)"></div>
                <div class="flex-1 rounded-full transition-colors duration-300" [ngClass]="getStrengthColor(1)"></div>
                <div class="flex-1 rounded-full transition-colors duration-300" [ngClass]="getStrengthColor(2)"></div>
                <div class="flex-1 rounded-full transition-colors duration-300" [ngClass]="getStrengthColor(3)"></div>
              </div>
            </div>

            <!-- Confirm Password -->
            <ng-container *ngIf="!isWatchMode()">
              <app-password-input
                id="confirmPassword"
                label="Confirm Password"
                placeholder="Confirm your password"
                [control]="securityInfo.get('confirmPassword')">
              </app-password-input>
              <p
                *ngIf="securityInfo.errors?.['mismatch']&& securityInfo.get('confirmPassword')?.touched"
                class="text-error text-xs mt-1 ml-1">
                Passwords do not match.
              </p>
            </ng-container>
          </div>
        </ng-container>

        <!-- Student Profile Setup  -->
        <ng-container *ngIf="currentStep === 4" formGroupName="profileSetup">
          <div class="space-y-3 animate-fade-in max-[360px]:space-y-2.5">

            <!-- Current Level -->
           <div class="relative w-full" #levelSelect>
            <label class="block text-sm font-medium text-text-primary mb-1">
              Current Level
            </label>

            <button
  type="button"
  (click)="openLevel = !openLevel"
  class="w-full bg-white border-2 py-2 pl-4 pr-10 text-sm shadow-sm
         transition-all duration-200 text-left relative
         border-primary focus:outline-none"
  [ngClass]="{
  'border-gray-200': !openLevel && !selectedLevel,
  'border-primary': openLevel || selectedLevel,
  'rounded-[var(--radius-md)]': !openLevel,
  'rounded-t-xl rounded-b-none': openLevel,
  'text-primary font-semibold': selectedLevel,
  'text-text-secondary': !selectedLevel
}">
              {{ selectedLevel || 'Select level' }}
              <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-primary">
            <svg
              class="w-4 h-4 transition-transform duration-200"
              [class.rotate-180]="openLevel"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 9l-7 7-7-7" />
            </svg>
          </div>
            </button>

  <div *ngIf="openLevel"
      class="absolute top-full left-0 z-10 w-full bg-white
       border-2 border-primary border-t-0
       rounded-b-xl shadow-lg overflow-hidden">

<button
  type="button"
  (click)="selectLevel('beginner')"
  class="w-full px-4 py-2 text-sm text-primary bg-white border-b border-primary
         transition-all duration-150 text-left
         hover:bg-primary hover:text-white">
  Beginner
</button>

<button
  type="button"
  (click)="selectLevel('intermediate')"
  class="w-full px-4 py-2 text-sm text-primary bg-white border-b border-primary
         transition-all duration-150 text-left
         hover:bg-primary hover:text-white">
  Intermediate
</button>

<button
  type="button"
  (click)="selectLevel('advanced')"
  class="w-full px-4 py-2 text-sm text-primary bg-white
         transition-all duration-150 text-left
         hover:bg-primary hover:text-white">
  Advanced
</button>
  </div>
           </div>

            <!-- Areas of Interest -->
            <div>
              <label class="block text-sm font-medium text-text-primary mb-1">Areas of Interest</label>
              <div class="flex flex-wrap gap-2 max-[360px]:gap-1.5">
                <button
                  type="button"
                  *ngFor="let interest of availableInterests"
                  (click)="toggleInterest(interest)"
                  class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 border
                         max-[360px]:px-3 max-[360px]:py-1 max-[360px]:text-xs-alt"
                  [ngClass]="interests.includes(interest)
                    ? 'bg-primary/10 border-primary text-primary shadow-interest-active transform -translate-y-[1px]'
                    : 'bg-surface border-gray-200 text-gray-400 hover:border-gray-300 hover:text-gray-600'">
                  {{ interest }}
                </button>
              </div>
            </div>

          </div>
        </ng-container>

      </div>

      <!-- Actions -->
      <div class="auth-card-actions mt-4 flex gap-2.5 items-center max-[360px]:mt-3 max-[360px]:gap-2">

        <button
          *ngIf="currentStep > 1"
          type="button"
          (click)="previousStep()"
          class="flex items-center justify-center h-btn-back px-4 rounded-[var(--radius-md)] border-2 border-primary text-primary
                 bg-transparent hover:bg-primary/5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <div class="flex-1 w-full">
          <app-auth-button
            [type]="'submit'"
            [loading]="isSubmitting"
            [disabled]="isStepInvalid()">
            {{ currentStep >= totalSteps ? 'Register' : 'Continue' }}
          </app-auth-button>
        </div>

      </div>

    </form>

    <!-- Social Login — Account Information step only -->
    <div *ngIf="!isWatchMode() && currentStep === 2" class="auth-card-social">
      <app-auth-divider>or continue with</app-auth-divider>
      <div class="mt-1.5 max-[360px]:mt-1">
        <app-social-login></app-social-login>
      </div>
    </div>

  </app-auth-card>
</app-auth-layout>
