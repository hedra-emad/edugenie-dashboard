<app-auth-layout>
  <app-auth-logo></app-auth-logo>
  
  <app-auth-card>
    <app-auth-tabs [activeTab]="'signup'" (onTabChange)="handleTabChange($event)"></app-auth-tabs>

    <!-- Progress bar -->
      <div class="mb-8">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold text-text-secondary uppercase tracking-wider">Step {{ currentStep }} of {{ totalSteps }}</span>
          <span class="text-xs font-semibold text-primary">{{ getStepTitle() }}</span>
        </div>
        <div class="h-2 w-full bg-gray-200 rounded-full overflow-hidden">
          <div class="h-full bg-primary transition-all duration-400 ease-in-out rounded-full" [style.width]="(currentStep / totalSteps * 100) + '%'"></div>
        </div>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="nextStep()">
        
        <!-- Step 1: Account Creation -->
        <ng-container *ngIf="currentStep === 1" formGroupName="accountCreation">
          <div class="space-y-4 animate-fade-in">
            
            <div class="flex flex-col sm:flex-row gap-4">
              <div class="flex-1">
                <app-auth-input id="firstName" label="First Name" placeholder="John" [control]="accountCreation.get('firstName')"></app-auth-input>
              </div>
              <div class="flex-1">
                <app-auth-input id="lastName" label="Last Name" placeholder="Doe" [control]="accountCreation.get('lastName')"></app-auth-input>
              </div>
            </div>

            <div class="relative group" style="margin-bottom: -1.25rem; padding-bottom: 1.25rem;">
              <app-auth-input
                id="email"
                type="email"
                label="Email Address"
                placeholder="john@example.com"
                [control]="accountCreation.get('email')">
                <svg icon class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </app-auth-input>
              <div *ngIf="accountCreation.get('email')?.valid && accountCreation.get('email')?.touched" class="absolute right-3 pointer-events-none" style="top: 38px;">
                <svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
            </div>

            <app-password-input
              id="password"
              label="Password"
              placeholder="Create a strong password"
              [control]="accountCreation.get('password')">
            </app-password-input>
            
            <div class="mb-4">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-text-secondary">Password strength</span>
                <span class="text-xs font-medium" 
                      [ngClass]="{'text-error': getPasswordStrength() === 1, 'text-warning': getPasswordStrength() === 2, 'text-success': getPasswordStrength() >= 3}">
                  {{ getPasswordStrengthText() }}
                </span>
              </div>
              <div class="flex gap-1 h-1.5">
                <div class="flex-1 rounded-full transition-colors duration-300" [ngClass]="getStrengthColor(0)"></div>
                <div class="flex-1 rounded-full transition-colors duration-300" [ngClass]="getStrengthColor(1)"></div>
                <div class="flex-1 rounded-full transition-colors duration-300" [ngClass]="getStrengthColor(2)"></div>
                <div class="flex-1 rounded-full transition-colors duration-300" [ngClass]="getStrengthColor(3)"></div>
              </div>
            </div>

            <app-password-input
              id="confirmPassword"
              label="Confirm Password"
              placeholder="Confirm your password"
              [control]="accountCreation.get('confirmPassword')">
            </app-password-input>
            <div *ngIf="accountCreation.hasError('mismatch') && accountCreation.get('confirmPassword')?.touched" class="text-error text-xs -mt-3 mb-4 absolute">
              Passwords do not match.
            </div>

            <app-role-selector formControlName="role"></app-role-selector>

          </div>
        </ng-container>

        <!-- Step 2: Profile Setup -->
        <ng-container *ngIf="currentStep === 2" formGroupName="profileSetup">
          <div class="space-y-5 animate-fade-in">
            
            <div class="relative">
              <label for="level" class="block text-sm font-medium text-text-primary mb-2">Current Level</label>
              <select id="level" formControlName="level" class="w-full bg-surface border border-gray-200 text-text-primary rounded-xl py-3 pl-4 pr-10 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 appearance-none">
                <option value="" disabled selected>Select your level</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
              <div class="pointer-events-none absolute bottom-0 right-0 flex items-center px-4 text-gray-500" style="top: 28px;">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>

            <app-auth-input
              id="goal"
              label="Primary Goal"
              placeholder="What do you want to achieve?"
              [control]="profileSetup.get('goal')">
              <svg icon class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
              </svg>
            </app-auth-input>

            <div>
              <label class="block text-sm font-medium text-text-primary mb-2">Areas of Interest</label>
              <div class="flex flex-wrap gap-2">
                <button type="button" 
                        *ngFor="let interest of availableInterests"
                        (click)="toggleInterest(interest)"
                        class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 border"
                        [ngClass]="profileSetup.get('interests')?.value.includes(interest) ? 'bg-primary/10 border-primary text-primary' : 'bg-surface border-gray-200 text-text-secondary hover:border-gray-300'">
                  {{ interest }}
                </button>
              </div>
            </div>

          </div>
        </ng-container>

        <!-- Form Actions -->
        <div class="mt-8 flex flex-col sm:flex-row gap-3 items-center">
          <button type="button" *ngIf="currentStep === 2" (click)="skipProfile()" class="w-full sm:w-auto px-4 py-2 text-sm rounded-xl border border-gray-200 text-text-secondary font-medium hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200">
            Skip for now
          </button>
          
          <div class="flex-1 w-full">
            <app-auth-button 
              [type]="'submit'"
              [loading]="isSubmitting"
              [disabled]="isStepInvalid()">
              {{ currentStep === totalSteps ? 'Complete Profile' : 'Continue' }}
            </app-auth-button>
          </div>
        </div>

      </form>

      <app-auth-divider *ngIf="currentStep === 1"></app-auth-divider>
      
      <div *ngIf="currentStep === 1" class="mt-6">
        <app-social-login></app-social-login>
      </div>

  </app-auth-card>
</app-auth-layout>
