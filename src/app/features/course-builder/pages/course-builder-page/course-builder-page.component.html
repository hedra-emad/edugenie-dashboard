<div class="bg-[var(--color-background-page)] font-sans antialiased overflow-x-hidden min-h-screen">
  <div class="max-w-[1000px] mx-auto w-full px-4 sm:px-8 py-4 sm:py-8 flex flex-col gap-4 sm:gap-8 pb-20">


    <!-- Course Header -->
    <app-course-header [draftStatus]="draftStatus()" [hasUnsavedChanges]="hasUnsavedChanges()"></app-course-header>

    <!-- Notification Alert Banner -->
    <div *ngIf="notificationMessage() as msg"
      class="p-4 rounded-xl text-white font-bold flex items-center gap-2 shadow-sm animate-fade-in"
      [style.background]="msg.type === 'success' ? 'var(--color-success)' : 'var(--color-error)'">
      <mat-icon>{{ msg.type === 'success' ? 'check_circle' : 'error' }}</mat-icon>
      <span>{{ msg.text }}</span>
    </div>

    <div class="flex items-center justify-center gap-4">

      <div class="w-10 h-10 rounded-full flex items-center justify-center" [class.bg-primary]="currentStep() >= 1">
        1
      </div>

      <div class="w-20 h-1 bg-gray-300"></div>

      <div class="w-10 h-10 rounded-full flex items-center justify-center" [class.bg-primary]="currentStep() >= 2">
        2
      </div>

    </div>


    <!-- Main Course Creation Form -->
    <form [formGroup]="courseForm" class="space-y-8">

      <app-course-basic-info [parentForm]="courseForm" [courseId]="createdCourseId()"
        (courseCreatedEvent)="onCourseCreated($event)">
      </app-course-basic-info>

      <app-section-builder *ngIf="currentStep() === 2 && createdCourseId()" [parentForm]="courseForm"
        [courseId]="createdCourseId()!"></app-section-builder>

    </form>


    <div class="flex justify-between">

      <button type="button" *ngIf="currentStep() > 1" (click)="previousStep()">
        Back
      </button>

      <button type="button" *ngIf="currentStep() < 2" (click)="nextStep()">
        Continue
      </button>

    </div>
    <!-- Sticky Bottom Publish Actions Bar -->
    <app-publish-actions [draftStatus]="draftStatus()" [hasUnsavedChanges]="hasUnsavedChanges()"
      [isValid]="courseForm.valid" [isSaving]="isSaving()" (saveDraft)="saveDraft()"
      (publishCourse)="publishCourse()"></app-publish-actions>

  </div>
</div>
