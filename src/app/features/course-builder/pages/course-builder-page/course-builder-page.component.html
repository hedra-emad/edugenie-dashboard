<div class="bg-[var(--color-background-page)] font-sans antialiased overflow-x-hidden min-h-screen">
  @if (loadingCourse()) {
    <!-- <app-loading [fullScreen]="true" text="Loading course..." /> -->
    <app-page-skeleton></app-page-skeleton>
  } @else {
    <div class="max-w-[1200px] mx-auto px-4 sm:px-8 py-8 sm:py-12 flex flex-col gap-8 min-h-screen">


      <!-- Course Header -->
      <app-course-header [courseTitle]="courseTitle()" [courseStatus]="courseStatus()" [courseDuration]="courseDuration()" [courseId]="courseId()" [canPublish]="canPublish()"></app-course-header>


      <div class="flex items-center justify-center gap-3 overflow-x-auto whitespace-nowrap px-2">

        <!-- Step 1 -->
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 text-sm rounded-full flex items-center justify-center font-bold transition-all border"
            [class.bg-[var(--color-primary)]]="currentStep() >= 1" [class.text-white]="currentStep() >= 1" [class.border-[var(--color-primary)]]="currentStep() >= 1"
            [class.bg-white]="currentStep() < 1" [class.border-[var(--color-border)]]="currentStep() < 1" [class.text-[var(--color-text-secondary)]]="currentStep() < 1">
            1
          </div>
        </div>

        <!-- line -->
        <div class="w-16 sm:w-20 h-[2px]" [class.bg-[var(--color-primary)]]="currentStep() >= 2"
          [class.bg-gray-300]="currentStep() < 2">
        </div>

        <!-- Step 2 -->
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 text-sm rounded-full flex items-center justify-center font-bold transition-all border"
            [class.bg-[var(--color-primary)]]="currentStep() >= 2" [class.text-white]="currentStep() >= 2" [class.border-[var(--color-primary)]]="currentStep() >= 2"
            [class.bg-white]="currentStep() < 2" [class.border-[var(--color-border)]]="currentStep() < 2" [class.text-[var(--color-text-secondary)]]="currentStep() < 2">
            2
          </div>
        </div>

        <!-- line -->
        <div class="w-16 sm:w-20 h-[2px]" [class.bg-[var(--color-primary)]]="currentStep() >= 3"
          [class.bg-gray-300]="currentStep() < 3">
        </div>

        <!-- Step 3 -->
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 text-sm rounded-full flex items-center justify-center font-bold transition-all border"
            [class.bg-[var(--color-primary)]]="currentStep() >= 3" [class.text-white]="currentStep() >= 3" [class.border-[var(--color-primary)]]="currentStep() >= 3"
            [class.bg-white]="currentStep() < 3" [class.border-[var(--color-border)]]="currentStep() < 3" [class.text-[var(--color-text-secondary)]]="currentStep() < 3">
            3
          </div>
        </div>

        <!-- line -->
        <div class="w-16 sm:w-20 h-[2px]" [class.bg-[var(--color-primary)]]="currentStep() >= 4"
          [class.bg-gray-300]="currentStep() < 4">
        </div>

        <!-- Step 4 -->
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 text-sm rounded-full flex items-center justify-center font-bold transition-all border"
            [class.bg-[var(--color-primary)]]="currentStep() >= 4" [class.text-white]="currentStep() >= 4" [class.border-[var(--color-primary)]]="currentStep() >= 4"
            [class.bg-white]="currentStep() < 4" [class.border-[var(--color-border)]]="currentStep() < 4" [class.text-[var(--color-text-secondary)]]="currentStep() < 4">
            4
          </div>
        </div>

      </div>

      <!-- Main Course Creation Form -->
      <router-outlet></router-outlet>

      <!-- Course Submission Section (Centralized) -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <div class="max-w-2xl mx-auto text-center space-y-4">
          <!-- Send for Review Button -->
          <div class="flex justify-center">
            <app-publish-course-button #publishButton [courseId]="courseId()" [course]="courseData()"></app-publish-course-button>
          </div>

          <!-- Helper Text - Only show when button is visible -->
          @if (publishButton.shouldShowButton()) {
            <div class="flex items-start justify-center gap-2 px-4">
              <p class="text-sm text-[var(--color-text-muted)] leading-relaxed max-w-md">
                {{ publishButton.helperText() }}
              </p>
            </div>
          }
        </div>
      </div>

    </div>
  }
</div>
