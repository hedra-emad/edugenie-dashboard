<div class="space-y-6">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-3">
        <div class="min-w-0">
            <h3 class="text-lg font-bold text-[var(--color-primary)]">
                Lessons
            </h3>

            <p class="text-xs text-gray-500 truncate sm:whitespace-normal">
                Manage lessons inside this section
            </p>
        </div>

        <button type="button" (click)="addLesson()"
            class="shrink-0 whitespace-nowrap text-xs font-bold uppercase px-4 py-2 rounded-lg border border-[var(--color-primary)] text-[var(--color-primary)] hover:bg-[var(--color-primary)] hover:text-white transition duration-150">
            Add Lesson
        </button>
    </div>

     <div *ngIf="isLoading">
        <app-page-skeleton></app-page-skeleton>
     </div>

    <!-- Empty state -->
    <app-empty-state *ngIf="!isLoading && lessonsArray.length === 0" icon="menu_book" title="No lessons in this section yet"
        description="Add lessons to start building your course content with videos, text, and interactive materials."
        actionLabel="Create First Lesson" (actionClicked)="addLesson()">
    </app-empty-state>

    <!-- Lesson cards -->
    <ng-container *ngIf="!isLoading && lessonsArray.length > 0">
    <div cdkDropList (cdkDropListDropped)="onLessonDropped($event)" class="space-y-4">
        <div cdkDrag *ngFor="let lesson of lessonsArray.controls; let i = index; trackBy: trackByLesson" [id]="'lesson-card-' + i">
            <div class="cdk-drag-placeholder" *cdkDragPlaceholder></div>
            <app-lesson-card [lessonForm]="lesson" [courseId]="courseId" [sectionId]="sectionId" [index]="i"
                [isFirst]="i === 0" [isLast]="i === lessonsArray.controls.length - 1" (delete)="onDeleted(i)"
                (moveUp)="moveUp(i)" (moveDown)="moveDown(i)" (lessonCreated)="onLessonCreated($event)">
            </app-lesson-card>
            
        </div>
    </div>
    <!-- Secondary Add Lesson button under each lesson card -->
            <div class="flex justify-center mt-3 mb-5">
              <button type="button" (click)="addLesson()"
                class="flex items-center gap-1.5 px-4 py-2 rounded-lg border border-[var(--color-primary)] text-[var(--color-primary)] text-xs font-bold uppercase hover:bg-[var(--color-primary)] hover:text-white transition duration-150">
                <mat-icon class="!text-[14px] !w-[14px] !h-[14px]">add</mat-icon>
                <span>Add another lesson</span>
              </button>
            </div>
    </ng-container>

    <!-- Navigation Actions -->
    <div class="flex justify-between items-center mt-6">
        <app-back-button label="Back" (back)="goBackToSections()"></app-back-button>
        <app-main-button [label]="hasQuiz ? 'Show Quiz' : 'Generate Quiz'" icon="arrow_forward" [disabled]="shouldDisableQuizButton"
            (action)="goToQuiz()"></app-main-button>
    </div>

    <!-- Course Submission Section -->
    <div class="mt-8 pt-6 border-t border-gray-200">
        <div class="max-w-2xl mx-auto text-center space-y-4">
            <!-- Helper Text -->
            <div class="flex items-start justify-center gap-2 px-4">
                <!-- <mat-icon class="text-[var(--color-primary)] !text-[20px] !w-[20px] !h-[20px] mt-0.5 hidden sm:block">
                    info
                </mat-icon> -->
                <p class="text-sm text-[var(--color-text-muted)] leading-relaxed max-w-md">
                    {{ publishButton.helperText() }}
                </p>
            </div>
            
            <!-- Send for Review Button -->
            <div class="flex justify-center">
                <app-publish-course-button #publishButton [courseId]="courseId" [course]="course"></app-publish-course-button>
            </div>
        </div>
    </div>

</div>
