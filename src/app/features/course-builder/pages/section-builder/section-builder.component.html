<div>
  <div class="flex flex-col mt-3 mb-5 sm:flex-row justify-between items-start sm:items-center gap-3">
    <div>
      <h3 class="text-lg font-bold text-[var(--color-primary)] flex items-center gap-2">
        <mat-icon class="text-[20px] w-5 h-5">list_alt</mat-icon>
        Course Curriculum
      </h3>

      <p class="text-xs text-[var(--color-text-secondary)] mt-0.5">
        Organize your course into sections, lessons, and video content.
      </p>
    </div>
    <button type="button" (click)="addSection()" class="text-xs w-full sm:w-fit font-bold uppercase tracking-wider inline-flex items-center justify-center gap-1
         leading-none transition-all hover:bg-[var(--color-primary)] hover:text-white px-4 py-2.5
         rounded-lg border border-[var(--color-primary)] text-[var(--color-primary)] shadow-sm active:scale-95">

      <mat-icon class="!text-[16px] !w-4 !h-4 flex items-center justify-center leading-none">
        add
      </mat-icon>

      <span class="leading-none flex items-center">Add Section</span>
    </button>
  </div>

  <!-- Course-level stats summary bar -->
  <div *ngIf="!isLoading && sections.length > 0"
    class="mb-4 flex items-center justify-center sm:justify-start gap-2 sm:gap-3 flex-wrap px-3 py-2.5 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] shadow-sm">

    <div class="flex items-center gap-1.5 text-xs font-semibold text-[var(--color-text-secondary)]">
      <mat-icon class="!text-[14px] !w-[14px] !h-[14px] block text-[var(--color-primary)]">layers</mat-icon>
      <span class="text-[var(--color-text-primary)]">{{ sections.length }}</span>&nbsp;sections
    </div>

    <span class="w-px h-3.5 bg-[var(--color-border)] block"></span>

    <div class="flex items-center gap-1.5 text-xs font-semibold text-[var(--color-text-secondary)]">
      <mat-icon class="!text-[14px] !w-[14px] !h-[14px] block text-[var(--color-primary)]">menu_book</mat-icon>
      <span class="text-[var(--color-text-primary)]">{{ totalCourseLessons }}</span>&nbsp;lessons total
    </div>

    <ng-container *ngIf="totalCourseDuration > 0">
      <span class="w-px h-3.5 bg-[var(--color-border)] block"></span>
      <div class="flex items-center gap-1.5 text-xs font-semibold text-[var(--color-text-secondary)]">
        <mat-icon class="!text-[14px] !w-[14px] !h-[14px] block text-[var(--color-primary)]">schedule</mat-icon>
        <span class="text-[var(--color-text-primary)]">{{ formatCourseDuration(totalCourseDuration) }}</span>&nbsp;total length
      </div>
    </ng-container>

  </div>

  <div class="space-y-4">

    <div *ngIf="isLoading" class="w-full py-8">
      <app-page-skeleton [showBadge]="false" [showStats]="false"></app-page-skeleton>
    </div>

    <ng-container *ngIf="!isLoading">
      <app-empty-state 
        *ngIf="sections.length === 0"
        icon="layers"
        title="Your curriculum is empty"
        description="Add sections to structure your lectures, quizzes, and project uploads."
        actionLabel="Create First Section"
        (actionClicked)="addSection()">
      </app-empty-state>

      <!-- Section list -->
      <div *ngIf="sections.length > 0" cdkDropList (cdkDropListDropped)="onSectionDropped($event)" class="space-y-3">
        <div cdkDrag *ngFor="let sectionGroup of sections; let sectionIdx = index; trackBy: trackBySection" [id]="'section-card-' + sectionIdx">
          <div class="cdk-drag-placeholder" *cdkDragPlaceholder></div>
          <app-section-card [sectionForm]="sectionGroup" [index]="sectionIdx" [courseId]="courseId"
            [highlight]="sectionGroup.get('id')?.value === highlightSectionId"
            [expanded]="sectionGroup.get('id')?.value === expandedSectionId" (sectionCreated)="onSectionCreated($event)"
            (delete)="onSectionDeleted(sectionIdx)">
          </app-section-card>
        </div>
      </div>

      <!-- Secondary Add Section button under the section list -->
      <div *ngIf="sections.length > 0" class="flex justify-center mt-3 mb-5">
        <button type="button" (click)="addSection()"
          class="flex items-center gap-1.5 px-4 py-2 rounded-lg border border-[var(--color-primary)] text-[var(--color-primary)] text-xs font-bold uppercase hover:bg-[var(--color-primary)] hover:text-white transition duration-150">
          <mat-icon class="!text-[14px] !w-[14px] !h-[14px]">add</mat-icon>
          <span>Add another section</span>
        </button>
      </div>
    </ng-container>

    <div class="mt-6 flex justify-start">
      <app-back-button label="Back" (back)="goToCourse()"></app-back-button>
    </div>

    <!-- Course Submission Section -->
    <div class="mt-8 pt-6 border-t border-gray-200">
        <div class="max-w-2xl mx-auto text-center space-y-4">
            <!-- Helper Text -->
            <div class="flex items-start justify-center gap-2 px-4">
                <mat-icon class="text-[var(--color-primary)] !text-[20px] !w-[20px] !h-[20px] mt-0.5 hidden sm:block">
                    info
                </mat-icon>
                <p class="text-sm text-[var(--color-text-muted)] leading-relaxed max-w-md">
                    {{ publishButton.helperText() }}
                </p>
            </div>
            
            <!-- Send for Review Button -->
            <div class="flex justify-center">
                <app-publish-course-button #publishButton [courseId]="courseId" [course]="course"></app-publish-course-button>
            </div>
        </div>
    </div>
  </div>
</div>
