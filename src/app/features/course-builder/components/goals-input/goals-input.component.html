<div class="space-y-3">
  <div class="flex items-center justify-between">
    <label class="text-[11px] sm:text-[13px] font-bold uppercase tracking-wider"
      [style.color]="'var(--color-text-primary)'">
      Course Learning Goals
    </label>
    <app-sub-button
      [label]="'Add Goal'"
      [icon]="'add'"
      (action)="addGoal()">
    </app-sub-button>
  </div>

  <div class="space-y-2.5">
    <div *ngIf="goals.length === 0" class="text-sm italic py-2" [style.color]="'var(--color-text-secondary)'">
      No goals added yet. Add what students will learn in this course.
    </div>

    <div *ngFor="let goalCtrl of goals; let i = index" class="flex items-start gap-2">

      <div class="flex-1">
        <input type="text" [formControl]="goalCtrl"
          placeholder="e.g. Learn how to build production-grade web applications" class="w-full px-4 py-3 rounded-lg border outline-none transition-all text-sm text-gray-800
             focus:ring-2 focus:ring-[var(--color-primary)]
             focus:border-[var(--color-primary)]" [ngClass]="{
        'border-red-500': goalCtrl.invalid && goalCtrl.touched,
        'border-gray-300': !(goalCtrl.invalid && goalCtrl.touched)
      }">

        <div *ngIf="goalCtrl.touched && goalCtrl.errors?.['required']" class="text-xs text-red-500 mt-1 font-medium">
          Goal can't be empty.
        </div>
      </div>

      <button type="button" (click)="removeGoal(i)"
        class="w-10 h-10 flex items-center justify-center rounded-lg border border-gray-200 transition-colors hover:bg-red-50 hover:text-[var(--color-error)]">
        <mat-icon class="!text-[18px] !w-[18px] !h-[18px] block">
          delete_outline
        </mat-icon>
      </button>

    </div>
  </div>
</div>
