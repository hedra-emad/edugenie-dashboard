<mat-expansion-panel [expanded]="true"
  class="section-panel border border-slate-200 rounded-2xl overflow-hidden shadow-md">
  <mat-expansion-panel-header>
    <mat-panel-title class="flex items-center justify-between w-full pr-4">
      <div class="flex items-center gap-2 font-bold text-sm sm:text-base leading-snug min-w-0"
        [style.color]="'var(--color-primary)'">
        <mat-icon class="text-slate-400 flex-shrink-0">folder_open</mat-icon>

        <span class="truncate block">
          {{ index + 1 }}: {{ sectionForm.get('title')?.value || 'Untitled Section' }}
        </span>
      </div>
      <!-- Actions inside the header (preventing panel toggle) -->
      <div class="flex items-center gap-1.5">

        <!-- MOVE UP -->
        <button type="button" [disabled]="isFirst" (click)="onMoveUp($event)"
          class="w-8 h-8 flex items-center justify-center rounded-full border border-gray-200 text-gray-500 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed"
          aria-label="Move Section Up">
          <span class="flex items-center justify-center w-full h-full">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px] block">
              arrow_upward
            </mat-icon>
          </span>
        </button>

        <!-- MOVE DOWN -->
        <button type="button" [disabled]="isLast" (click)="onMoveDown($event)"
          class="w-8 h-8 flex items-center justify-center rounded-full border border-gray-200 text-gray-500 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed"
          aria-label="Move Section Down">
          <span class="flex items-center justify-center w-full h-full">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px] block">
              arrow_downward
            </mat-icon>
          </span>
        </button>

        <!-- DELETE -->
        <button type="button" (click)="onDelete($event)"
          class="w-8 h-8 flex items-center justify-center rounded-full border border-red-100 text-[var(--color-error)] hover:bg-red-50"
          aria-label="Delete Section">
          <span class="flex items-center justify-center w-full h-full">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px] block">
              delete
            </mat-icon>
          </span>
        </button>

      </div>
    </mat-panel-title>
  </mat-expansion-panel-header>

  <!-- Expanded content: full form -->
  <div [formGroup]="sectionForm" class="pt-6 space-y-6">
    <!-- Title & Toggle -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
      <!-- Section Title -->
      <div class="md:col-span-2 space-y-2">
        <label class="text-xs font-bold uppercase tracking-wider block text-gray-700">
          Section Title <span class="text-red-500">*</span>
        </label>
        <input type="text" formControlName="title" placeholder="e.g. Introduction to Angular Signals"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--color-primary)] focus:border-[var(--color-primary)] outline-none transition-all text-sm text-gray-800">
        <span *ngIf="sectionForm.get('title')?.touched && sectionForm.get('title')?.invalid"
          class="text-xs font-semibold block mt-1" [style.color]="'var(--color-error)'">
          Section title is required.
        </span>
      </div>

      <!-- Basic Section Toggle -->
      <div class="flex items-center justify-between p-3.5 rounded-lg border border-gray-200 bg-slate-50">
        <div>
          <span class="text-xs font-bold text-gray-700 block">Basic Section</span>
          <span class="text-[10px] text-gray-500">Free preview for students</span>
        </div>
        <button type="button"
          (click)="sectionForm.get('isBasicSection')?.setValue(!sectionForm.get('isBasicSection')?.value); sectionForm.get('isBasicSection')?.markAsDirty()"
          class="relative inline-flex h-5 w-9 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#00B0FF]"
          [ngClass]="sectionForm.get('isBasicSection')?.value ? 'bg-[#00B0FF]' : 'bg-gray-200'" role="switch"
          [attr.aria-checked]="sectionForm.get('isBasicSection')?.value">
          <span
            class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
            [ngClass]="sectionForm.get('isBasicSection')?.value ? 'translate-x-4' : 'translate-x-0'"></span>
        </button>
      </div>
    </div>

    <!-- Description -->
    <div class="space-y-2">
      <label class="text-xs font-bold uppercase tracking-wider block text-gray-700">
        Section Description
      </label>
      <textarea formControlName="description" rows="2"
        placeholder="Brief description of this section's core objectives..."
        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--color-primary)] focus:border-[var(--color-primary)] outline-none transition-all text-sm text-gray-800 resize-none"></textarea>
    </div>

    <!-- Expected Outcomes -->
    <div class="space-y-3 p-4 bg-slate-50/50 border border-slate-100 rounded-xl">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold uppercase tracking-wider block text-gray-700">
          Expected Section Outcomes
        </label>
        <button type="button" (click)="addOutcome()"
          class="text-xs font-bold uppercase tracking-wider flex items-center gap-1 transition-all hover:opacity-80 active:scale-95 px-3 py-1.5 rounded-lg border border-[var(--color-secondary)]"
          [style.color]="'var(--color-secondary)'">
          <mat-icon class="!text-[16px] !w-4 !h-4 leading-none flex items-center justify-center">add</mat-icon>
          Add Outcome
        </button>
      </div>

      <div class="space-y-2">
        <div *ngIf="outcomes.length === 0" class="text-xs italic text-gray-500 py-1">
          No outcomes added yet. List what skills students get from this section.
        </div>

        <div *ngFor="let outcomeCtrl of outcomes; let outcomeIdx = index" class="flex items-center gap-2">
          <div class="flex-1 relative">
            <input type="text" [formControl]="outcomeCtrl"
              placeholder="e.g. Understand the difference between Signals and RxJS Observables"
              class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--color-primary)] focus:border-[var(--color-primary)] outline-none transition-all text-xs text-gray-800">
            <span *ngIf="outcomeCtrl.touched && outcomeCtrl.invalid"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-semibold"
              [style.color]="'var(--color-error)'">
              Required
            </span>
          </div>
          <button type="button" (click)="removeOutcome(outcomeIdx)"
            class="w-10 h-10 flex items-center justify-center rounded-lg border border-gray-200 transition-colors hover:bg-red-50 hover:text-[var(--color-error)]"
            aria-label="Remove goal">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px] block">
              delete_outline
            </mat-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Section Lessons Area
    <div class="space-y-4 pt-4 border-t border-slate-100">
      <div class="flex items-center justify-between mb-2">
        <h4 class="text-sm font-extrabold uppercase tracking-wider text-[var(--color-primary)]">

        </h4>

        </button>
      </div>

          <button
            type="button"
            (click)="addLesson()"
            class="mt-2 text-[11px] font-extrabold text-[var(--color-primary)] uppercase tracking-wider"

    <!-- Create Section Button -->
    <div class="pt-6 border-t border-slate-100 flex justify-end">
      <button type="button" (click)="onCreateSection($event)" class="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 transition-all 
           hover:bg-[var(--color-primary-light)] px-5 py-3 rounded-lg border 
           text-white bg-[var(--color-primary)] shadow-md active:scale-95">
        <mat-icon class="text-[18px] w-[18px] h-[18px] flex items-center justify-center">
          add
        </mat-icon>
        Create Section
      </button>
    </div>
  </div>
</mat-expansion-panel>
