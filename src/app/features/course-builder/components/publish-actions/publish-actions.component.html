<div class="sticky bottom-[-16px] md:bottom-[-24px] mx-[-16px] md:mx-[-24px] z-30 bg-white border-t border-slate-200 py-4 px-6 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-[var(--shadow-footer)]">
  <!-- Left info -->
  <div class="flex flex-wrap items-center gap-3">
    <!-- Draft status badge -->
    <div
      class="px-3 py-1.5 rounded-full text-xs font-black uppercase tracking-wider flex items-center gap-1.5 border"
      [ngClass]="draftStatus === 'draft' ? 'badge-draft' : 'badge-published'"
    >
      <span class="w-1.5 h-1.5 rounded-full" [ngClass]="draftStatus === 'draft' ? 'bg-[var(--color-warning)]' : 'bg-[var(--color-success)]'"></span>
      <span>{{ draftStatus }}</span>
    </div>

    <!-- Unsaved Changes indicator -->
    <div
      *ngIf="hasUnsavedChanges"
      class="flex items-center gap-1.5 text-xs font-bold text-[var(--color-warning)] px-2.5 py-1.5 rounded-lg bg-amber-50/50 border border-amber-100"
    >
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[var(--color-warning)] opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-[var(--color-warning)]"></span>
      </span>
      <span>Unsaved Changes</span>
    </div>
    <div
      *ngIf="!hasUnsavedChanges"
      class="flex items-center gap-1.5 text-xs font-bold text-gray-400 px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-100"
    >
      <mat-icon class="text-[14px] w-3.5 h-3.5 flex items-center justify-center text-[var(--color-success)]">check_circle</mat-icon>
      <span>All changes saved</span>
    </div>
  </div>

  <!-- Right actions -->
  <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
    <!-- Save Draft Button -->
    <button
      type="button"
      [disabled]="isSaving"
      (click)="saveDraft.emit()"
      class="px-5 py-2.5 rounded-lg text-sm font-semibold border border-slate-200 text-gray-700 hover:bg-slate-50 hover:text-gray-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shrink-0 cursor-pointer"
    >
      Save Draft
    </button>

    <!-- Publish Course Button -->
    <button
      type="button"
      [disabled]="isSaving || !isValid"
      (click)="publishCourse.emit()"
      class="px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-[var(--color-primary)] hover:bg-[var(--color-primary-light)] transition-colors flex items-center justify-center gap-2 shadow-md shadow-[#3B1892]/20 disabled:opacity-50 disabled:cursor-not-allowed shrink-0 min-w-[145px] cursor-pointer"
    >
      <span *ngIf="isSaving" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
      <span>Publish Course</span>
    </button>
  </div>
</div>
