<div class="space-y-3 mt-4">
  <div class="flex items-center justify-between">
<label class="text-[11px] sm:text-[13px] font-bold uppercase tracking-wider"
       [style.color]="'var(--color-text-primary)'">
  Course Requirements
</label>
    <button
  type="button"
  (click)="addRequirement()"
class="inline-flex items-center gap-1 whitespace-nowrap text-[10px] sm:text-xs font-bold uppercase tracking-wider px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg border border-[var(--color-secondary)] text-[var(--color-secondary)] transition-all duration-200
hover:bg-[var(--color-secondary)] hover:text-white active:scale-95"
>
  <mat-icon class="!text-[16px] !w-[16px] !h-[16px] block leading-none">
    add
  </mat-icon>

  <span class="leading-none whitespace-nowrap">
    Add Requirement
  </span>
</button>
  </div>

  <div class="space-y-2.5">
    <div *ngIf="requirements.length === 0" class="text-sm italic py-2" [style.color]="'var(--color-text-secondary)'">
      No requirements added yet. Add prerequisites or setup instructions for this course.
    </div>

    <div *ngFor="let reqCtrl of requirements; let i = index" class="flex items-center gap-2">
      <div class="flex-1 relative">
        <input
          type="text"
          [formControl]="reqCtrl"
          placeholder="e.g. Basic knowledge of HTML, CSS, and JavaScript"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--color-primary)] focus:border-[var(--color-primary)] outline-none transition-all text-sm text-gray-800"
        >
        <span *ngIf="reqCtrl.touched && reqCtrl.invalid" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold" [style.color]="'var(--color-error)'">
          Required
        </span>
      </div>
      <button
  type="button"
  (click)="removeRequirement(i)"
  class="w-10 h-10 flex items-center justify-center rounded-lg border border-gray-200 transition-colors hover:bg-red-50 hover:text-[var(--color-error)]"
  aria-label="Remove goal"
>
  <mat-icon class="!text-[18px] !w-[18px] !h-[18px] block">
    delete_outline
  </mat-icon>
</button>
    </div>
  </div>
</div>
