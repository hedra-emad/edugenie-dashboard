<div class="space-y-2">
  <label class="block text-sm font-semibold text-[var(--color-text-primary)]">
    Category *
  </label>

  <!-- Root combobox wrapper -->
  <div
    class="relative"
    role="combobox"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    [attr.aria-disabled]="isDisabled()">

    <!-- Search input wrapper -->
    <div
      class="relative flex items-center rounded-xl border transition-all duration-200 bg-white"
      [class.border-gray-300]="!isTouchedAndInvalid"
      [class.border-red-500]="isTouchedAndInvalid"
      [class.focus-within:ring-2]="!isDisabled()"
      [class.focus-within:ring-primary/20]="!isDisabled()"
      [class.focus-within:border-primary]="!isDisabled()"
      [style.box-shadow]="isOpen() ? '0 10px 15px -3px rgba(var(--color-primary), 0.1)' : '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)'">

      <!-- Leading search icon -->
      <mat-icon class="absolute left-3 text-gray-400 pointer-events-none">
        search
      </mat-icon>

      <!-- Search input -->
      <input
  #searchInput
  type="text"
  [value]="selectedCategoryName() || searchTerm()"
  (input)="onSearchInput($event)"
  (focus)="onFocus()"
  (blur)="onBlur()"
  (keydown.escape)="onEscape()"
  (keydown.arrowdown)="onArrowDown($event)"
  (keydown.arrowup)="onArrowUp($event)"
  (keydown.enter)="onEnter()"
  [disabled]="isDisabled()"
  [placeholder]="selectedCategoryId() ? selectedCategoryName() : 'Select category'"
  class="flex-1 px-4 py-3 pl-10 pr-16 bg-transparent outline-none text-sm placeholder:text-gray-400"
  aria-label="Search or select a category"
  [attr.aria-readonly]="isDisabled()" />

      <!-- Trailing icon cluster -->
      <div class="absolute right-3 flex items-center gap-1">
        <!-- Clear button -->
        <button
          *ngIf="selectedCategoryId()"
          type="button"
          (click)="clearSelection($event)"
          class="p-1.5 rounded-md text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors"
          [disabled]="isDisabled()"
          aria-label="Clear selection"
          title="Clear selection">
          <mat-icon class="!text-[16px] !w-[16px] !h-[16px]">
            close
          </mat-icon>
        </button>

        <!-- Chevron (dropdown indicator) -->
        <button
          type="button"
          (click)="toggleOpen()"
          class="p-1.5 rounded-md text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-all"
          [disabled]="isDisabled()"
          [attr.aria-label]="isOpen() ? 'Close dropdown' : 'Open dropdown'"
          title="Toggle dropdown">
          <mat-icon
            class="!text-[16px] !w-[16px] !h-[16px] transition-transform duration-200"
            [class.rotate-180]="isOpen()">
            expand_more
          </mat-icon>
        </button>
      </div>
    </div>

    <!-- Dropdown panel -->
    <div
      *ngIf="isOpen()"
      class="absolute z-50 mt-2 w-full bg-white rounded-xl border overflow-hidden animate-fadeScaleIn"
      [style.border-color]="'var(--color-primary)'"
      [style.box-shadow]="'0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)'"
      role="listbox">

      <!-- Loading skeleton -->
      <div
        *ngIf="isLoadingCategories()"
        class="px-4 py-3 space-y-2">
        <div class="h-10 bg-gray-100 rounded-lg animate-pulse"></div>
        <div class="h-10 bg-gray-100 rounded-lg animate-pulse"></div>
        <div class="h-10 bg-gray-100 rounded-lg animate-pulse"></div>
      </div>

      <!-- Categories list -->
      <div
        *ngIf="!isLoadingCategories() && filteredCategories().length > 0"
        class="max-h-64 overflow-y-auto">
        <button
  *ngFor="let cat of filteredCategories(); let i = index; trackBy: trackByCategoryId"
  #optionItem
  type="button"
  (click)="selectCategory(cat)"
  (mouseenter)="setActiveIndex(i)"
  class="w-full px-4 py-2.5 flex items-center gap-3 cursor-pointer transition-colors text-left"
  [class.bg-gray-100]="i === activeIndex() && selectedCategoryId() !== cat.id"
  [style.backgroundColor]="selectedCategoryId() === cat.id ? 'var(--color-primary)' : ''"
  [style.color]="selectedCategoryId() === cat.id ? '#ffffff' : 'inherit'"
  role="option"
  [attr.aria-selected]="selectedCategoryId() === cat.id">
          <!-- Category icon or placeholder -->
          <div
            class="w-6 h-6 rounded-md flex-shrink-0 bg-gray-200 overflow-hidden"
            *ngIf="!cat.iconUrl; else hasIcon">
            <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-gray-300 to-gray-400">
              <mat-icon class="!text-[12px] !w-[12px] !h-[12px] text-gray-600">
                category
              </mat-icon>
            </div>
          </div>
          <ng-template #hasIcon>
            <img
              [src]="cat.iconUrl"
              [alt]="cat.name"
              class="w-6 h-6 rounded-md object-cover flex-shrink-0" />
          </ng-template>

          <!-- Category name -->
          <span
            class="flex-1 truncate text-sm font-medium"
            [class.text-white]="selectedCategoryId() === cat.id"
            [class.text-slate-700]="selectedCategoryId() !== cat.id"
            [title]="cat.name">
            {{ cat.name }}
          </span>

          <!-- Check icon for selected item -->
          <mat-icon
            *ngIf="selectedCategoryId() === cat.id"
            class="!text-[16px] !w-[16px] !h-[16px] flex-shrink-0 text-white">
            check
          </mat-icon>
        </button>
      </div>

      <!-- Empty state -->
      <div
        *ngIf="!isLoadingCategories() && filteredCategories().length === 0"
        class="py-6 text-center">
        <mat-icon class="!text-5xl !w-12 !h-12 mx-auto mb-2 text-gray-300">
          search_off
        </mat-icon>
        <p class="text-sm text-gray-400">
          {{ searchTerm() ? 'No categories found' : 'No categories available' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="isTouchedAndInvalid" class="flex items-center gap-1.5 text-xs text-red-500 font-medium mt-1">
    <mat-icon class="!text-[14px] !w-[14px] !h-[14px]">
      error
    </mat-icon>
    <span>Category is required</span>
  </div>
</div>
