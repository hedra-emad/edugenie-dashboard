<button type="button" (click)="publishCourse()" [disabled]="!courseId || loading()" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium text-white
         bg-[var(--color-primary)]
         hover:opacity-90
         disabled:opacity-50
         disabled:cursor-not-allowed">

    @if (loading()) {
    <span>Sending...</span>
    } @else {
    <span>Send for Review</span>
    }

</button>
