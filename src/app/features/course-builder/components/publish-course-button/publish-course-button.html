<!-- Under Review State -->
@if (isUnderReview()) {
<div class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm
         bg-blue-50 border-2 border-blue-200 text-blue-700
         min-w-[180px]">
    <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">schedule</mat-icon>
    <span>Waiting for Approval</span>
</div>
}

<!-- Published State -->
@if (isPublished()) {
<div class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm
         bg-green-50 border-2 border-green-200 text-green-700
         min-w-[180px]">
    <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">check_circle</mat-icon>
    <span>Published</span>
</div>
}

<!-- Send for Review Button (for draft and rejected courses) -->
@if (shouldShowButton()) {
<button type="button" (click)="publishCourse()" [disabled]="isDisabled()" 
    class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm text-white
         bg-[var(--color-primary)]
         hover:opacity-90
         hover:shadow-md
         disabled:opacity-50
         disabled:cursor-not-allowed
         transition-all duration-200
         min-w-[180px] mb-6" >

    @if (loading()) {
    <span>Sending...</span>
    } @else {
    <span>Send for Review</span>
    <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">send</mat-icon>
    }

</button>
}

<!-- Helper/Status Message (always show for non-published courses) -->
@if (!isPublished()) {
<div class="flex items-start justify-center gap-2 px-4">
  <mat-icon class="!text-[16px] !w-[16px] !h-[16px] text-[var(--color-text-secondary)] flex-shrink-0 mt-0.5">info</mat-icon>
  <p class="text-sm text-[var(--color-text-secondary)] leading-relaxed max-w-md">
    {{ helperText() }}
  </p>
</div>
}
