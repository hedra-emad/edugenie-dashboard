<div class="mt-3">
  <!-- Toggle link -->
  <button type="button" (click)="toggle()"
    class="flex items-center gap-1.5 text-xs font-semibold text-[var(--color-primary)] hover:opacity-75 transition-opacity">
    <mat-icon class="!text-[14px] !w-[14px] !h-[14px]">
      {{ expanded() ? 'expand_less' : 'play_circle_outline' }}
    </mat-icon>
    <span *ngIf="!hasVideo && !selectedFile">
      {{ expanded() ? 'Cancel' : '+ Add preview video (optional)' }}
    </span>
    <span *ngIf="hasVideo && !selectedFile">
      {{ expanded() ? 'Hide preview video' : 'Preview video ✓' }}
    </span>
    <span *ngIf="selectedFile">
      Preview video selected (unsaved)
    </span>
  </button>

  <!-- Expanded panel -->
  <div *ngIf="expanded()" class="mt-3 p-3 rounded-xl border border-dashed border-[var(--color-border)] bg-[var(--color-background)] space-y-3">

    <!-- A: File selected, not yet uploaded -->
    <div *ngIf="selectedFile && uploadState === 'idle'">
      <video [src]="selectedFileUrl!" controls
        class="w-full rounded-lg max-h-40 bg-black"></video>
      <div class="flex items-center justify-between mt-2">
        <p class="text-xs text-[var(--color-text-secondary)] flex items-center gap-1">
          <mat-icon class="!text-[13px] !w-[13px] !h-[13px] text-amber-500">schedule</mat-icon>
          Will upload when you save
        </p>
        <button type="button" (click)="removeFile()"
          class="text-xs font-semibold text-red-500 hover:opacity-75 transition-opacity flex items-center gap-1">
          <mat-icon class="!text-[13px] !w-[13px] !h-[13px]">delete_outline</mat-icon>
          Remove
        </button>
      </div>
    </div>

    <!-- B: Uploading (triggered by parent save) -->
    <div *ngIf="uploadState === 'uploading'" class="space-y-2">
      <!-- Steps (mirrors lesson-card) -->
      <div class="flex items-center justify-between text-xs font-semibold">
        <div class="flex items-center gap-2 text-[var(--color-primary)]">
          <app-loading [size]="14" color="#00B0FF"></app-loading>
          <span>Upload Preview</span>
        </div>
        <div class="flex-1 mx-3 h-px bg-gray-200"></div>
        <div class="flex items-center gap-2 text-gray-400">
          <mat-icon class="!text-[14px] !w-[14px] !h-[14px] text-gray-300">radio_button_unchecked</mat-icon>
          <span>Save</span>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
        <div class="h-full rounded-full bg-[#00B0FF] transition-all duration-300"
          [style.width.%]="uploadProgress"></div>
      </div>
      <p class="text-xs text-gray-500 text-center">Uploading preview… {{ uploadProgress }}%</p>
    </div>

    <!-- C: Upload error -->
    <div *ngIf="uploadState === 'upload_error'"
      class="bg-red-50 border border-red-200 rounded-xl p-3 text-center space-y-2">
      <div class="flex items-center justify-center gap-1.5 text-red-600 text-xs font-semibold">
        <mat-icon class="!text-[15px] !w-[15px] !h-[15px]">error_outline</mat-icon>
        Preview upload failed
      </div>
      <p class="text-xs text-red-500">{{ uploadError }}</p>
      <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-600 hover:bg-red-700
        text-white text-xs font-bold rounded-lg cursor-pointer transition-colors">
        <input type="file" accept="video/*" hidden (change)="onFileSelected($event)" />
        <mat-icon class="!text-[13px] !w-[13px] !h-[13px]">video_file</mat-icon>
        Try Again
      </label>
    </div>

    <!-- D: Existing saved video -->
    <div *ngIf="hasVideo && !selectedFile && uploadState !== 'uploading' && uploadState !== 'upload_error'">
      <video [src]="existingUrl!" controls
        class="w-full rounded-lg max-h-40 bg-black"></video>
      <div class="flex items-center justify-between mt-2">
        <p class="text-xs text-[var(--color-text-secondary)]">
          Visible to students before purchasing
        </p>
        <div class="flex gap-3">
          <label class="text-xs font-semibold text-[var(--color-primary)] cursor-pointer hover:opacity-75 flex items-center gap-1">
            <input type="file" accept="video/*" hidden (change)="onFileSelected($event)" />
            <mat-icon class="!text-[13px] !w-[13px] !h-[13px]">edit</mat-icon>
            Replace
          </label>
          <button type="button" (click)="removeExisting()"
            class="text-xs font-semibold text-red-500 hover:opacity-75 flex items-center gap-1">
            <mat-icon class="!text-[13px] !w-[13px] !h-[13px]">delete_outline</mat-icon>
            Remove
          </button>
        </div>
      </div>
    </div>

    <!-- E: No video, no file selected -->
    <div *ngIf="!hasVideo && !selectedFile && uploadState === 'idle'">
      <label class="flex flex-col items-center justify-center gap-2 py-5 cursor-pointer
        rounded-lg border-2 border-dashed border-[var(--color-border)]
        hover:border-[var(--color-primary)] transition-colors text-center">
        <input type="file" accept="video/*" hidden (change)="onFileSelected($event)" />
        <mat-icon class="!text-3xl text-gray-400">video_call</mat-icon>
        <span class="text-xs font-semibold text-gray-600">Click to select preview video</span>
        <span class="text-xs text-[var(--color-text-secondary)]">
          Uploaded when you save · MP4, MOV · max 200MB
        </span>
      </label>
    </div>

    <!-- Validation error -->
    <div *ngIf="videoError" class="flex items-center gap-1.5 text-xs text-red-500 font-medium">
      <mat-icon class="!text-[13px] !w-[13px] !h-[13px]">error</mat-icon>
      {{ videoError }}
    </div>

  </div>
</div>
