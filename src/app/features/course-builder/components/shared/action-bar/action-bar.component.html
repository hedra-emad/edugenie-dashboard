<div class="flex items-center justify-between border-t border-gray-200 bg-white">
    <button *ngIf="showBack" type="button"
        class="flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-gray-900" [disabled]="disabled"
        (click)="back.emit()">

        <span *ngIf="backLabel">{{ backLabel }}</span>
        <span *ngIf="!backLabel">Back</span>

    </button>

    <button type="button"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium text-white bg-[var(--color-primary)] hover:bg-[var(--color-primary-dark)] disabled:opacity-50"
        [disabled]="disabled || loading" (click)="action.emit()">

        <mat-icon *ngIf="actionIcon">
            {{ actionIcon }}
        </mat-icon>

        <span>{{ actionLabel }}</span>

    </button>
</div>
