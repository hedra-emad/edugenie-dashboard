<div [formGroup]="parentForm" class="space-y-4">

  <!-- Thumbnail -->

  <div
  class="relative h-56 rounded-xl overflow-hidden border border-slate-200 cursor-pointer"
  (click)="fileInput.click()"
>

<div>
  <h3 class="text-base font-bold text-[var(--color-primary)]">
    Course Thumbnail
  </h3>

  <input
  type="file"
  accept="image/*"
  hidden
  #fileInput
  (change)="onFileSelected($event)"
/>

  <p class="text-xs text-[var(--color-text-secondary)]">
    Upload a banner image for your course
  </p>
</div>

<div
  class="relative h-56 rounded-xl overflow-hidden border border-slate-200"
>

  <img
    *ngIf="thumbnailPreview()"
    [src]="thumbnailPreview()"
    class="w-full h-full object-cover"
  >

  <div
    *ngIf="!thumbnailPreview()"
    class="h-full flex flex-col items-center justify-center gap-2 text-gray-400"
  >
    <mat-icon>image</mat-icon>
    <span class="text-sm">No thumbnail selected</span>
  </div>

</div>

  </div>

  <!-- Course Details -->

  <div class="bg-white border border-slate-100 rounded-xl shadow-sm p-4 space-y-4">

<h3 class="text-base font-bold text-[var(--color-primary)] flex items-center gap-2">
  <mat-icon>info</mat-icon>
  Course Details
</h3>

<div>
  <label class="block text-xs font-bold mb-2">
    Course Title *
  </label>

  <input
    type="text"
    formControlName="title"
    placeholder="Master Angular Standalone Components"
    class="w-full px-4 py-3 rounded-lg border border-gray-300 outline-none"
  >

  <span
    *ngIf="getControl('title').touched && getControl('title').invalid"
    class="text-xs text-red-500"
  >
    Required
  </span>
</div>

<div>
  <label class="block text-xs font-bold mb-2">
    Description *
  </label>

  <textarea
    formControlName="description"
    rows="4"
    placeholder="Write a compelling overview..."
    class="w-full px-4 py-3 rounded-lg border border-gray-300 outline-none resize-none"
  ></textarea>

  <span
    *ngIf="getControl('description').touched && getControl('description').invalid"
    class="text-xs text-red-500"
  >
    Required
  </span>
</div>

  </div>


  <!-- Level + Price + Category -->

  <div class="bg-white border border-slate-100 rounded-xl shadow-sm p-4">

  <h3 class="text-base font-bold text-[var(--color-primary)] flex items-center gap-2 mb-4">
    <mat-icon>tune</mat-icon>
    Course Settings
  </h3>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

    <!-- Level -->
    <div>

      <label class="block text-sm font-medium mb-2">
        Level *
      </label>

      <div class="relative"  [style.z-index]="openLevel ? 999 : 'auto'">

        <button
          type="button"
          (click)="openLevel = !openLevel"
         class="w-full bg-white border-2 py-3 px-4 text-sm shadow-sm
         transition-all duration-200 text-left relative"
  [ngClass]="{
    'border-gray-300': !openLevel,
    'border-primary': openLevel,
    'rounded-xl': !openLevel,
    'rounded-t-xl rounded-b-none': openLevel
  }"
        >
          {{ getControl('level').value || 'Select level' }}

          <mat-icon
  class="absolute right-3 top-1/2 -translate-y-1/2
         transition-transform duration-200"
  [class.rotate-180]="openLevel"
>
            expand_more
          </mat-icon>
        </button>

        <div
  *ngIf="openLevel"
  class="absolute top-full left-0 z-20 w-full bg-white
         border-2 border-primary border-t-0
         rounded-b-xl shadow-lg overflow-hidden"
>

          <button
            type="button"
            (click)="selectLevel('beginner')"
            class="w-full px-4 py-3 text-sm text-left
               hover:bg-[var(--color-primary)]
               hover:text-white transition-colors"
          >
            Beginner
          </button>

          <button
            type="button"
            (click)="selectLevel('intermediate')"
            class="w-full px-4 py-3 text-sm text-left
               hover:bg-[var(--color-primary)]
               hover:text-white transition-colors"
          >
            Intermediate
          </button>

          <button
            type="button"
            (click)="selectLevel('advanced')"
            class="w-full px-4 py-3 text-sm text-left
               hover:bg-[var(--color-primary)]
               hover:text-white transition-colors"
          >
            Advanced
          </button>

        </div>

      </div>

    </div>

    <!-- Price -->
    <div>

      <label class="block text-sm font-medium mb-2">
        Price *
      </label>

      <div class="relative">

        <span
          class="absolute left-4 top-1/2 -translate-y-1/2"
        >
          $
        </span>

        <input
  type="number"
  formControlName="price"
  class="w-full pl-8 pr-4 py-3 rounded-xl border-2 border-gray-300
         focus:border-primary
         focus:outline-none
         transition-all duration-200"
/>

      </div>

    </div>

    <!-- Category -->
    <div>
      <app-category-selector
        [control]="getControl('category')"
      ></app-category-selector>
    </div>

  </div>

</div>

  <!-- Goals & Requirements -->

  <div class="bg-white border border-slate-100 rounded-xl shadow-sm p-4 space-y-4">

<app-goals-input
  [goalsArray]="goalsArray"
></app-goals-input>

<hr>

<app-requirements-input
  [requirementsArray]="requirementsArray"
></app-requirements-input>

  </div>

  <!-- Continue -->

  <div class="flex justify-end">


<button
  type="button"
  (click)="createCourse()"
  [disabled]="parentForm.invalid"
  class="inline-flex items-center gap-2 px-5 py-3 rounded-xl
         bg-[var(--color-primary)] text-white font-semibold
         disabled:opacity-50"
>
  <mat-icon>arrow_forward</mat-icon>
  Continue
</button>

  </div>

</div>
