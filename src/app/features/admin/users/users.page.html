<div class="max-w-[1200px] mx-auto p-6 md:p-8 space-y-8">
  
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">User Management</h1>
      <p class="text-sm text-gray-500 mt-1">Manage platform accounts, roles, and access statuses.</p>
    </div>
    
    <!-- Clean, standard SaaS button -->
    <button class="inline-flex items-center justify-center px-4 py-2.5 bg-[var(--color-primary)] hover:bg-[#3b1892]/90 text-white text-sm font-medium rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--color-primary)]">
      Export Platform Report
    </button>
  </div>

  <!-- Filters & Search (Clean layout) -->
  <div class="flex flex-col lg:flex-row items-center justify-between gap-4">
    
    <!-- Search Bar -->
    <div class="relative w-full lg:w-96">
      <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 !text-[20px] !w-[20px] !h-[20px]">search</mat-icon>
      <input type="text" placeholder="Search by name, email, or ID..." 
             class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent transition-shadow">
    </div>
    
    <!-- Filters -->
    <div class="flex items-center gap-3 w-full lg:w-auto">
      <button class="flex items-center justify-between w-full lg:w-[130px] px-3.5 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 hover:border-gray-400 transition-all focus:ring-2 focus:ring-[var(--color-primary)] focus:outline-none">
        All Roles
        <mat-icon class="!text-[18px] !w-[18px] !h-[18px] text-gray-500">expand_more</mat-icon>
      </button>

      <button class="flex items-center justify-between w-full lg:w-[130px] px-3.5 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 hover:border-gray-400 transition-all focus:ring-2 focus:ring-[var(--color-primary)] focus:outline-none">
        All Statuses
        <mat-icon class="!text-[18px] !w-[18px] !h-[18px] text-gray-500">expand_more</mat-icon>
      </button>
    </div>
  </div>

  <!-- Showing Text (Simple) -->
  <div class="text-sm text-gray-500 font-medium">
    Showing 1-10 of 2,451 users
  </div>

  <!-- Table Card (No Scroll) -->
  <div class="bg-white border border-gray-200 rounded-xl shadow-sm w-full overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-50 border-b border-gray-200">
          <th class="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider text-left">Name</th>
          <th class="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider text-left">Email</th>
          <th class="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider text-left">Current Role</th>
          <th class="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider text-left">Status</th>
          <th class="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider text-center w-[160px]">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let user of users; let i = index" class="hover:bg-gray-50/50 transition-colors group">
          <td class="py-4 px-6 align-middle text-left">
            <div class="flex items-center gap-3">
              <img [src]="user.avatar" class="w-10 h-10 rounded-full object-cover bg-gray-100 border border-gray-200">
              <div>
                <div class="text-sm font-semibold text-gray-900">{{user.name}}</div>
                <div class="text-xs text-gray-500 mt-0.5">{{user.joined}}</div>
              </div>
            </div>
          </td>
          <td class="py-4 px-6 align-middle text-left">
            <span class="text-sm text-gray-600">{{user.email}}</span>
          </td>
          <td class="py-4 px-6 align-middle text-left">
            <div class="inline-flex items-center justify-between min-w-[100px] px-2.5 py-1 rounded-md bg-gray-100 text-gray-700 text-xs font-medium cursor-pointer hover:bg-gray-200 transition-colors border border-transparent hover:border-gray-300">
              {{user.role}}
              <mat-icon class="!text-[16px] !w-[16px] !h-[16px] text-gray-500">expand_more</mat-icon>
            </div>
          </td>
          <td class="py-4 px-6 align-middle text-left">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium"
                  [ngClass]="{'bg-green-50 text-green-700': user.status === 'Active', 'bg-gray-100 text-gray-600': user.status === 'Inactive'}">
              <span class="w-1.5 h-1.5 rounded-full" [ngClass]="{'bg-green-500': user.status === 'Active', 'bg-gray-400': user.status === 'Inactive'}"></span>
              {{user.status}}
            </span>
          </td>
          <td class="py-4 px-6 align-middle">
            <div class="flex items-center justify-center gap-2">
              <!-- Edit -->
              <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors">
                <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">edit</mat-icon>
              </button>
              <!-- Block (Gray to Red on hover) -->
              <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-colors">
                <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">block</mat-icon>
              </button>
              <!-- More -->
              <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors">
                <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">more_vert</mat-icon>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination matching Instructor Courses (Simplified for single page) -->
    <nav class="flex justify-center items-center gap-3 p-6 bg-white border-t border-gray-200">
      <button class="flex items-center justify-center text-gray-400 disabled:opacity-40 disabled:cursor-not-allowed transition" disabled>
        <mat-icon>chevron_left</mat-icon>
      </button>

      <button class="w-9 h-9 flex items-center justify-center rounded-full text-sm font-medium transition bg-[#6366f1] text-white shadow-md scale-110">
        1
      </button>

      <button class="flex items-center justify-center text-gray-400 disabled:opacity-40 disabled:cursor-not-allowed transition" disabled>
        <mat-icon>chevron_right</mat-icon>
      </button>
    </nav>
  </div>
</div>
